<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Boardly</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="topbar">
    <div class="header-nav-row">
      <h1 class="logo">Boardly</h1>
      
      <!-- Toolbar Scroll Navigation Buttons -->
      <button class="toolbar-scroll-btn" id="scroll-left" title="Scroll Left">‹</button>

      <!-- Centers board tabs and manages overflow mask states -->
      <div class="tabs-wrapper" id="tabs-wrapper">
        <div class="tabs" id="tabs"></div>
      </div>

      <button class="toolbar-scroll-btn" id="scroll-right" title="Scroll Right">›</button>

      <!-- Explicit Layout Spacer to enforce rigid padding before the action button -->
      <div class="header-spacer"></div>

      <!-- Placed directly in the row to anchor beautifully to the right edge -->
      <button id="add-tab" title="Add New Tab"><span>+</span> Tab</button>
    </div>
  </header>

  <!-- Main Grid Workspace Canvas -->
  <main id="board"></main>

<!-- Bottom-Left Undo Button with balanced arc SVG -->
  <button id="undo-btn" class="undo-btn" title="Undo deletion">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 12a8 8 0 1 1-7.15-7.95L14 6"></path>
      <path d="M14 3v4h-4"></path>
    </svg>
  </button>

  <!-- Floating Content Action Cluster (Bottom Right) -->
  <div class="floating-actions">
    <button id="add-goal" title="Add Goal"><span class="btn-icon">+</span> Goal</button>
    <button id="add-task" title="Add Task"><span class="btn-icon">+</span> Task</button>
    <button id="add-note" title="Add Note"><span class="btn-icon">+</span> Note</button>
  </div>

  <!-- Floating Trash Dropzone (Far Bottom Right) -->
  <div class="trash-bin" id="trash-bin" title="Drag cards or tabs here to delete">
    <div class="trash-icon">🗑️</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
