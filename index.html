<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boardly</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <div class="logo">Boardly</div>
    <div id="tabs-wrapper" class="tabs-wrapper">
      <div id="tabs" class="tabs-container"></div>
    </div>
    <button id="add-tab" class="add-tab-btn" title="Add Board Tab">+</button>
  </header>

  <!-- Main Canvas Board -->
  <main id="board" class="board-canvas"></main>

  <!-- Bottom-Left Undo Button -->
  <button id="undo-btn" class="undo-btn" title="Undo deletion">↶</button>

  <!-- Floating Action Buttons -->
  <div class="floating-actions">
    <button id="add-goal" class="action-btn"><span class="btn-icon">+</span>Goal</button>
    <button id="add-task" class="action-btn"><span class="btn-icon">+</span>Task</button>
    <button id="add-note" class="action-btn"><span class="btn-icon">+</span>Note</button>
  </div>

  <!-- Drag-and-Drop Trash Bin -->
  <div class="trash-bin" title="Drag items here to delete">🗑️</div>

  <script src="app.js"></script>
</body>
</html>
